<button
  [type]="type()"
  [disabled]="isDisabled()"
  [attr.aria-busy]="loading()"
  [attr.aria-label]="ariaLabel()"
  (click)="onClick($event)"
  class="inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition-all duration-150 cursor-pointer select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 active:scale-[0.99] disabled:opacity-50 disabled:pointer-events-none"
  [class.w-full]="fullWidth()"
  [class.h-9]="size() === 'sm'"
  [class.px-3]="size() === 'sm'"
  [class.text-xs]="size() === 'sm'"
  [class.h-11]="size() === 'md'"
  [class.px-4]="size() === 'md'"
  [class.text-sm]="size() === 'md'"
  [class.h-12]="size() === 'lg'"
  [class.px-6]="size() === 'lg'"
  [class.text-base]="size() === 'lg'"
  [class.bg-indigo-600]="variant() === 'primary'"
  [class.text-white]="variant() === 'primary' || variant() === 'danger'"
  [class.shadow-sm]="variant() === 'primary' || variant() === 'danger'"
  [class.shadow-indigo-600/20]="variant() === 'primary'"
  [class.hover:bg-indigo-500]="variant() === 'primary'"
  [class.bg-slate-100]="variant() === 'secondary'"
  [class.text-slate-800]="variant() === 'secondary'"
  [class.hover:bg-slate-200]="variant() === 'secondary'"
  [class.dark:bg-slate-800]="variant() === 'secondary'"
  [class.dark:text-slate-100]="variant() === 'secondary'"
  [class.dark:hover:bg-slate-700]="variant() === 'secondary'"
  [class.border]="variant() === 'outline'"
  [class.border-slate-300]="variant() === 'outline'"
  [class.bg-transparent]="variant() === 'outline' || variant() === 'ghost'"
  [class.text-slate-700]="variant() === 'outline' || variant() === 'ghost'"
  [class.hover:bg-slate-100]="variant() === 'outline' || variant() === 'ghost'"
  [class.dark:border-slate-700]="variant() === 'outline'"
  [class.dark:text-slate-200]="variant() === 'outline' || variant() === 'ghost'"
  [class.dark:hover:bg-slate-800]="variant() === 'outline' || variant() === 'ghost'"
  [class.bg-rose-600]="variant() === 'danger'"
  [class.shadow-rose-600/20]="variant() === 'danger'"
  [class.hover:bg-rose-500]="variant() === 'danger'"
>
  @if (loading()) {
    <svg
      class="size-4 animate-spin text-current"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
      />
    </svg>
  }
  <ng-content select="[slot=icon-left]" />
  <span><ng-content /></span>
  <ng-content select="[slot=icon-right]" />
</button>
