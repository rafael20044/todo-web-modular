<div class="w-full space-y-1.5">
  @if (label() || showCount()) {
    <div class="flex items-center justify-between gap-2">
      @if (label()) {
        <label
          [for]="id()"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200 select-none"
        >
          {{ label() }}
          @if (required()) {
            <span class="text-rose-500 ml-0.5" aria-hidden="true">*</span>
          }
        </label>
      }
      @if (showCount()) {
        <span class="text-xs text-slate-400 dark:text-slate-500 tabular-nums">
          {{ charCount() }} / {{ maxlength() }}
        </span>
      }
    </div>
  }

  <textarea
    [id]="id()"
    [rows]="rows()"
    [value]="value()"
    [placeholder]="placeholder()"
    [required]="required()"
    [disabled]="disabled()"
    [attr.maxlength]="maxlength()"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="error() ? id() + '-error' : hint() ? id() + '-hint' : null"
    (input)="onInput($event)"
    class="w-full rounded-xl border p-3.5 bg-white dark:bg-slate-800/60 text-sm text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all duration-150 focus:outline-none focus:ring-2 resize-y disabled:opacity-50 disabled:cursor-not-allowed"
    [class.border-slate-300]="!error()"
    [class.dark:border-slate-700]="!error()"
    [class.focus:border-indigo-600]="!error()"
    [class.focus:ring-indigo-600/20]="!error()"
    [class.border-rose-500]="!!error()"
    [class.dark:border-rose-500]="!!error()"
    [class.focus:border-rose-500]="!!error()"
    [class.focus:ring-rose-500/20]="!!error()"
  ></textarea>

  @if (error()) {
    <p
      [id]="id() + '-error'"
      class="text-xs font-medium text-rose-600 dark:text-rose-400"
      role="alert"
    >
      {{ error() }}
    </p>
  } @else if (hint()) {
    <p [id]="id() + '-hint'" class="text-xs text-slate-500 dark:text-slate-400">
      {{ hint() }}
    </p>
  }
</div>
