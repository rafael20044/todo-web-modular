<div class="w-full space-y-1.5">
  @if (label()) {
    <div class="flex items-center justify-between gap-2">
      <label
        [for]="id()"
        class="block text-sm font-medium text-slate-700 dark:text-slate-200 select-none"
      >
        {{ label() }}
        @if (required()) {
          <span class="text-rose-500 ml-0.5" aria-hidden="true">*</span>
        }
      </label>
      <ng-content select="[slot=label-action]" />
    </div>
  }

  <div class="relative flex items-center">
    @if (hasLeadingIcon()) {
      <div
        class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 dark:text-slate-500"
        aria-hidden="true"
      >
        <ng-content select="[slot=icon]" />
      </div>
    }

    <input
      [id]="id()"
      [type]="resolvedType()"
      [value]="value()"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [required]="required()"
      [disabled]="disabled()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="error() ? id() + '-error' : hint() ? id() + '-hint' : null"
      (input)="onInput($event)"
      class="w-full h-11 rounded-xl border bg-white dark:bg-slate-800/60 text-sm text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all duration-150 focus:outline-none focus:ring-2 disabled:opacity-50 disabled:cursor-not-allowed"
      [class.pl-10]="hasLeadingIcon()"
      [class.pl-3.5]="!hasLeadingIcon()"
      [class.pr-10]="type() === 'password'"
      [class.pr-3.5]="type() !== 'password'"
      [class.border-slate-300]="!error()"
      [class.dark:border-slate-700]="!error()"
      [class.focus:border-indigo-600]="!error()"
      [class.focus:ring-indigo-600/20]="!error()"
      [class.border-rose-500]="!!error()"
      [class.dark:border-rose-500]="!!error()"
      [class.focus:border-rose-500]="!!error()"
      [class.focus:ring-rose-500/20]="!!error()"
    />

    @if (type() === 'password') {
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 focus-visible:outline-none focus-visible:text-indigo-600 cursor-pointer"
      >
        @if (showPassword()) {
          <svg
            class="size-5"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.75"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
            />
          </svg>
        } @else {
          <svg
            class="size-5"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.75"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        }
      </button>
    }
  </div>

  @if (error()) {
    <p [id]="id() + '-error'" class="text-xs font-medium text-rose-600 dark:text-rose-400" role="alert">
      {{ error() }}
    </p>
  } @else if (hint()) {
    <p [id]="id() + '-hint'" class="text-xs text-slate-500 dark:text-slate-400">
      {{ hint() }}
    </p>
  }
</div>
