<div
  class="rounded-2xl bg-white dark:bg-slate-900 shadow-xl shadow-slate-200/60 dark:shadow-none ring-1 ring-slate-200/80 dark:ring-slate-800 transition-all duration-200"
  [class.hover:shadow-2xl]="hoverable()"
  [class.hover:ring-indigo-500/40]="hoverable()"
>
  @if (hasHeader()) {
    <div class="px-6 pt-6 pb-4 border-b border-slate-100 dark:border-slate-800">
      <ng-content select="[slot=header]" />
    </div>
  }

  <div
    [class.p-0]="padding() === 'none'"
    [class.p-4]="padding() === 'sm'"
    [class.p-6]="padding() === 'md'"
    [class.sm:p-8]="padding() === 'lg'"
    [class.p-6]="padding() === 'lg'"
  >
    <ng-content />
  </div>

  @if (hasFooter()) {
    <div
      class="px-6 py-4 bg-slate-50/70 dark:bg-slate-800/40 border-t border-slate-100 dark:border-slate-800 rounded-b-2xl"
    >
      <ng-content select="[slot=footer]" />
    </div>
  }
</div>
