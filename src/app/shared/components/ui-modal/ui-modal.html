@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title() ? 'modal-title' : null"
  >
    <!-- Backdrop -->
    <div
      class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs transition-opacity"
      (click)="closed.emit()"
      aria-hidden="true"
    ></div>

    <!-- Dialog Panel -->
    <div
      class="relative z-10 w-full rounded-2xl bg-white dark:bg-slate-900 shadow-2xl ring-1 ring-slate-200 dark:ring-slate-800 overflow-hidden transition-all"
      [class.max-w-sm]="size() === 'sm'"
      [class.max-w-lg]="size() === 'md'"
      [class.max-w-2xl]="size() === 'lg'"
    >
      <!-- Header -->
      <div class="flex items-start justify-between gap-4 px-6 pt-6 pb-4 border-b border-slate-100 dark:border-slate-800">
        <div>
          @if (title()) {
            <h2 id="modal-title" class="text-lg font-semibold text-slate-900 dark:text-slate-100">
              {{ title() }}
            </h2>
          }
          @if (description()) {
            <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
              {{ description() }}
            </p>
          }
        </div>

        <button
          type="button"
          (click)="closed.emit()"
          aria-label="Cerrar ventana"
          class="rounded-xl p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:text-slate-200 dark:hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 cursor-pointer"
        >
          <svg class="size-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path
              d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"
            />
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="p-6">
        <ng-content />
      </div>

      <!-- Footer -->
      @if (hasFooter()) {
        <div
          class="flex items-center justify-end gap-3 px-6 py-4 bg-slate-50/80 dark:bg-slate-800/40 border-t border-slate-100 dark:border-slate-800"
        >
          <ng-content select="[slot=footer]" />
        </div>
      }
    </div>
  </div>
}
