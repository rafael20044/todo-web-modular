<span
  class="inline-flex items-center gap-1.5 font-medium rounded-full ring-1 ring-inset select-none"
  [class.px-2]="size() === 'sm'"
  [class.py-0.5]="size() === 'sm'"
  [class.text-[11px]]="size() === 'sm'"
  [class.px-2.5]="size() === 'md'"
  [class.py-1]="size() === 'md'"
  [class.text-xs]="size() === 'md'"
  [class.bg-indigo-50]="variant() === 'indigo'"
  [class.text-indigo-700]="variant() === 'indigo'"
  [class.ring-indigo-600/20]="variant() === 'indigo'"
  [class.dark:bg-indigo-500/10]="variant() === 'indigo'"
  [class.dark:text-indigo-400]="variant() === 'indigo'"
  [class.dark:ring-indigo-500/30]="variant() === 'indigo'"
  [class.bg-emerald-50]="variant() === 'emerald'"
  [class.text-emerald-700]="variant() === 'emerald'"
  [class.ring-emerald-600/20]="variant() === 'emerald'"
  [class.dark:bg-emerald-500/10]="variant() === 'emerald'"
  [class.dark:text-emerald-400]="variant() === 'emerald'"
  [class.dark:ring-emerald-500/30]="variant() === 'emerald'"
  [class.bg-amber-50]="variant() === 'amber'"
  [class.text-amber-800]="variant() === 'amber'"
  [class.ring-amber-600/20]="variant() === 'amber'"
  [class.dark:bg-amber-500/10]="variant() === 'amber'"
  [class.dark:text-amber-400]="variant() === 'amber'"
  [class.dark:ring-amber-500/30]="variant() === 'amber'"
  [class.bg-rose-50]="variant() === 'rose'"
  [class.text-rose-700]="variant() === 'rose'"
  [class.ring-rose-600/20]="variant() === 'rose'"
  [class.dark:bg-rose-500/10]="variant() === 'rose'"
  [class.dark:text-rose-400]="variant() === 'rose'"
  [class.dark:ring-rose-500/30]="variant() === 'rose'"
  [class.bg-slate-100]="variant() === 'slate'"
  [class.text-slate-700]="variant() === 'slate'"
  [class.ring-slate-500/20]="variant() === 'slate'"
  [class.dark:bg-slate-800]="variant() === 'slate'"
  [class.dark:text-slate-300]="variant() === 'slate'"
  [class.dark:ring-slate-700]="variant() === 'slate'"
>
  @if (dot()) {
    <span
      class="size-1.5 rounded-full"
      [class.bg-indigo-600]="variant() === 'indigo'"
      [class.dark:bg-indigo-400]="variant() === 'indigo'"
      [class.bg-emerald-600]="variant() === 'emerald'"
      [class.dark:bg-emerald-400]="variant() === 'emerald'"
      [class.bg-amber-500]="variant() === 'amber'"
      [class.dark:bg-amber-400]="variant() === 'amber'"
      [class.bg-rose-600]="variant() === 'rose'"
      [class.dark:bg-rose-400]="variant() === 'rose'"
      [class.bg-slate-500]="variant() === 'slate'"
      [class.dark:bg-slate-400]="variant() === 'slate'"
      aria-hidden="true"
    ></span>
  }
  <ng-content />
</span>
