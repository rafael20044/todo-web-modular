<div class="w-full space-y-1.5">
  @if (label()) {
    <label
      [for]="id()"
      class="block text-sm font-medium text-slate-700 dark:text-slate-200 select-none"
    >
      {{ label() }}
      @if (required()) {
        <span class="text-rose-500 ml-0.5" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="relative flex items-center">
    <select
      [id]="id()"
      [value]="value()"
      [required]="required()"
      [disabled]="isDisabled()"
      [attr.aria-invalid]="!!displayError()"
      (change)="onChange($event)"
      (blur)="onBlur()"
      class="w-full h-11 appearance-none rounded-xl border pl-3.5 pr-10 bg-white dark:bg-slate-800/60 text-sm text-slate-900 dark:text-slate-100 transition-all duration-150 focus:outline-none focus:ring-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
      [class.border-slate-300]="!displayError()"
      [class.dark:border-slate-700]="!displayError()"
      [class.focus:border-indigo-600]="!displayError()"
      [class.focus:ring-indigo-600/20]="!displayError()"
      [class.border-rose-500]="!!displayError()"
      [class.dark:border-rose-500]="!!displayError()"
      [class.focus:border-rose-500]="!!displayError()"
      [class.focus:ring-rose-500/20]="!!displayError()"
    >
      @if (placeholder()) {
        <option value="">{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>

    <div
      class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 dark:text-slate-500"
      aria-hidden="true"
    >
      <svg class="size-4" viewBox="0 0 20 20" fill="currentColor">
        <path
          fill-rule="evenodd"
          d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
          clip-rule="evenodd"
        />
      </svg>
    </div>
  </div>

  @if (displayError()) {
    <p class="text-xs font-medium text-rose-600 dark:text-rose-400" role="alert">
      {{ displayError() }}
    </p>
  }
</div>
