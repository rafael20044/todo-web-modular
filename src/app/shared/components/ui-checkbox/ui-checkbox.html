<label
  [for]="id()"
  class="group inline-flex items-start gap-3 select-none"
  [class.cursor-pointer]="!disabled()"
  [class.cursor-not-allowed]="disabled()"
  [class.opacity-50]="disabled()"
>
  <span class="relative flex items-center justify-center mt-0.5">
    <input
      [id]="id()"
      type="checkbox"
      [checked]="checked()"
      [disabled]="disabled()"
      (change)="onToggle($event)"
      class="peer size-4.5 appearance-none rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 checked:bg-indigo-600 checked:border-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all duration-150 cursor-pointer disabled:cursor-not-allowed"
    />
    <svg
      class="pointer-events-none absolute size-3 text-white opacity-0 scale-75 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-150"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        fill-rule="evenodd"
        d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z"
        clip-rule="evenodd"
      />
    </svg>
  </span>

  @if (label() || description()) {
    <span class="flex flex-col text-sm leading-tight">
      @if (label()) {
        <span
          class="font-medium text-slate-700 dark:text-slate-200 transition-colors"
          [class.line-through]="strikethroughOnCheck() && checked()"
          [class.text-slate-400]="strikethroughOnCheck() && checked()"
          [class.dark:text-slate-500]="strikethroughOnCheck() && checked()"
        >
          {{ label() }}
        </span>
      }
      @if (description()) {
        <span class="mt-0.5 text-xs text-slate-500 dark:text-slate-400">
          {{ description() }}
        </span>
      }
    </span>
  }
  <ng-content />
</label>
