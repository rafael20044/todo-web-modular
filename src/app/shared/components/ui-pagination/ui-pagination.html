<nav
  aria-label="Paginación de resultados"
  class="flex flex-col sm:flex-row items-center justify-between gap-3 px-4 py-3 rounded-xl border border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs sm:text-sm"
>
  <p class="text-slate-600 dark:text-slate-400">
    Página <span class="font-semibold text-slate-900 dark:text-white">{{ pageNumber() + 1 }}</span>
    de <span class="font-semibold text-slate-900 dark:text-white">{{ totalPages() || 1 }}</span>
    <span class="mx-1.5 text-slate-300 dark:text-slate-700">·</span>
    <span class="font-medium">{{ totalElements() }}</span> registros en total
  </p>

  <div class="inline-flex items-center gap-2">
    <button
      type="button"
      [disabled]="first()"
      (click)="goPrevious()"
      class="inline-flex items-center gap-1.5 h-9 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-40 disabled:pointer-events-none transition-colors cursor-pointer"
    >
      <svg class="size-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
          clip-rule="evenodd"
        />
      </svg>
      Anterior
    </button>

    <button
      type="button"
      [disabled]="last()"
      (click)="goNext()"
      class="inline-flex items-center gap-1.5 h-9 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-40 disabled:pointer-events-none transition-colors cursor-pointer"
    >
      Siguiente
      <svg class="size-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>
</nav>
