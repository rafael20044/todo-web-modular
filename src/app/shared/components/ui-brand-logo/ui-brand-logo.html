<div class="inline-flex items-center gap-3 select-none">
  <div
    class="flex items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm shadow-indigo-600/30"
    [class.size-8]="size() === 'sm'"
    [class.size-9]="size() === 'md'"
    [class.size-10]="size() === 'lg'"
    aria-hidden="true"
  >
    <svg
      [class.size-4]="size() === 'sm'"
      [class.size-5]="size() === 'md'"
      [class.size-6]="size() === 'lg'"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2.2"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
      />
    </svg>
  </div>

  <span
    class="font-bold tracking-tight"
    [class.text-base]="size() === 'sm'"
    [class.text-lg]="size() === 'md'"
    [class.text-xl]="size() === 'lg'"
    [class.text-slate-900]="theme() === 'auto'"
    [class.dark:text-white]="theme() === 'auto'"
    [class.text-white]="theme() === 'light'"
  >
    {{ appName() }}
  </span>
</div>
