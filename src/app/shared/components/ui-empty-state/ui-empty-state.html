<div
  class="flex flex-col items-center justify-center text-center px-6 py-12 rounded-2xl border border-dashed border-slate-300 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/40"
>
  <div
    class="flex size-14 items-center justify-center rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 ring-1 ring-indigo-600/15 mb-4"
    aria-hidden="true"
  >
    <ng-content select="[slot=icon]">
      <svg
        class="size-7"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.75"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
        />
      </svg>
    </ng-content>
  </div>

  <h3 class="text-base font-semibold text-slate-900 dark:text-slate-100">
    {{ title() }}
  </h3>

  @if (description()) {
    <p class="mt-1 max-w-sm text-sm text-slate-500 dark:text-slate-400">
      {{ description() }}
    </p>
  }

  <div class="mt-5">
    <ng-content select="[slot=action]" />
  </div>
</div>
