<div class="w-full space-y-2">
  @if (label()) {
    <div class="flex items-center justify-between">
      <label
        [for]="id()"
        class="block text-sm font-medium text-slate-700 dark:text-slate-200 select-none"
      >
        {{ label() }}
      </label>
      <span class="font-mono text-xs font-medium text-slate-500 dark:text-slate-400">
        {{ value() }}
      </span>
    </div>
  }

  <div class="flex flex-wrap items-center gap-2.5">
    @for (hex of presets(); track hex) {
      <button
        type="button"
        (click)="selectPreset(hex)"
        [style.background-color]="hex"
        [attr.aria-label]="'Seleccionar color ' + hex"
        [attr.aria-pressed]="value().toUpperCase() === hex.toUpperCase()"
        class="size-7 rounded-full transition-transform duration-150 hover:scale-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 cursor-pointer"
        [class.ring-2]="value().toUpperCase() === hex.toUpperCase()"
        [class.ring-offset-2]="value().toUpperCase() === hex.toUpperCase()"
        [class.ring-slate-900]="value().toUpperCase() === hex.toUpperCase()"
        [class.dark:ring-white]="value().toUpperCase() === hex.toUpperCase()"
        [class.dark:ring-offset-slate-900]="value().toUpperCase() === hex.toUpperCase()"
      ></button>
    }

    <label
      [for]="id()"
      title="Color personalizado (#RRGGBB)"
      class="relative inline-flex size-7 items-center justify-center rounded-full border border-dashed border-slate-400 dark:border-slate-600 hover:border-indigo-500 cursor-pointer overflow-hidden"
    >
      <input
        [id]="id()"
        type="color"
        [value]="value()"
        (input)="onColorInput($event)"
        class="sr-only"
      />
      <svg
        class="size-4 text-slate-500 dark:text-slate-400"
        viewBox="0 0 20 20"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z"
        />
      </svg>
    </label>
  </div>
</div>
